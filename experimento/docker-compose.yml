name: ta-ind-01-seaweedfs

x-seaweedfs: &seaweedfs
  image: chrislusf/seaweedfs:3.85@sha256:d67f9b5586f73b6623c143489849c958ae0ec36a698bf4243a19df07cfa28c22
  platform: linux/amd64
  restart: "no"

services:
  master:
    <<: *seaweedfs
    command: ["master", "-ip=master", "-ip.bind=0.0.0.0", "-port=9333", "-mdir=/data", "-volumeSizeLimitMB=32", "-defaultReplication=001"]
    ports:
      - "127.0.0.1:9333:9333"
    volumes:
      - master-data:/data
      - ./master.toml:/etc/seaweedfs/master.toml:ro

  volume1:
    <<: *seaweedfs
    command: ["volume", "-ip=volume1", "-ip.bind=0.0.0.0", "-port=8080", "-mserver=master:9333", "-dir=/data", "-max=64", "-dataCenter=dc1", "-rack=rack1", "-readMode=local"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - volume1-data:/data
    depends_on:
      - master

  volume2:
    <<: *seaweedfs
    command: ["volume", "-ip=volume2", "-ip.bind=0.0.0.0", "-port=8080", "-mserver=master:9333", "-dir=/data", "-max=64", "-dataCenter=dc1", "-rack=rack1", "-readMode=local"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - volume2-data:/data
    depends_on:
      - master

  filer:
    <<: *seaweedfs
    command: ["filer", "-ip=filer", "-ip.bind=0.0.0.0", "-master=master:9333", "-port=8888", "-defaultReplicaPlacement=001", "-defaultStoreDir=/data"]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - filer-data:/data
    depends_on:
      - master
      - volume1
      - volume2

  s3:
    <<: *seaweedfs
    command: ["s3", "-filer=filer:8888", "-ip.bind=0.0.0.0", "-port=8333"]
    ports:
      - "127.0.0.1:8333:8333"
    depends_on:
      - filer

volumes:
  master-data:
  volume1-data:
  volume2-data:
  filer-data:
